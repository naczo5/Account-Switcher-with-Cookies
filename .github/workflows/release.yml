name: 'Release'

on:
  push:
    tags:
      - 'v*'
      - '*-pre*'
      - '*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. 3.4.0-pre2)'
        required: false
        type: string
      prerelease:
        description: 'Mark as Pre-release'
        required: true
        type: boolean
        default: true
      draft:
        description: 'Mark as Draft'
        required: true
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: 'Build & Publish Release'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 'Setup JDK 8 (Forge 1.8.9)'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: 'Setup JDK 21 (Modern Fabric)'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 'Setup Gradle'
        uses: gradle/actions/setup-gradle@v3

      - name: 'Run Parser Tests'
        run: |
          chmod +x tests/run-parser-tests
          ./tests/run-parser-tests

      - name: 'Build Modern Fabric Targets (26.3, 26.2, 1.21.11)'
        run: ./gradlew assemble

      - name: 'Build Forge 1.8.9 Target'
        run: |
          cd forge-1.8
          chmod +x gradlew
          ./gradlew build -Dorg.gradle.java.home="$JAVA_HOME_8_X64"

      - name: 'Collect Release Artifacts'
        run: |
          mkdir -p release-assets
          cp -v build/libs/CookieIAS-*.jar release-assets/
          cp -v forge-1.8/build/libs/CookieIAS-*.jar release-assets/
          echo "Collected Jars:"
          ls -lh release-assets/

      - name: 'Publish GitHub Release'
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.jar
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          prerelease: ${{ inputs.prerelease || contains(github.ref_name, 'pre') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          draft: ${{ inputs.draft || false }}
          generate_release_notes: true
