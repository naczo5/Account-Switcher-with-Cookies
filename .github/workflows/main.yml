name: 'Build (Main)'
permissions: { }
concurrency:
  group: 'main'
  cancel-in-progress: true
on:
  push:
    branches: [ 'main' ]
  workflow_dispatch:
jobs:
  main:
    name: 'Build & Test (Main)'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 60
    permissions:
      contents: 'read'
    env:
      GRADLE_OPTS: '-Dorg.gradle.java.installations.auto-download=false'
    steps:
      - name: 'Checkout'
        timeout-minutes: 2
        uses: 'actions/checkout@v4'
        with:
          persist-credentials: false

      - name: 'Setup JDK (8 for Forge 1.8.9)'
        timeout-minutes: 2
        uses: 'actions/setup-java@v4'
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: 'Setup JDK (21 for Modern Fabric)'
        timeout-minutes: 2
        uses: 'actions/setup-java@v4'
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 'Setup Gradle'
        timeout-minutes: 10
        uses: 'gradle/actions/setup-gradle@v3'

      - name: 'Run Parser Tests'
        timeout-minutes: 5
        run: |
          chmod +x tests/run-parser-tests
          ./tests/run-parser-tests

      - name: 'Build Modern Fabric (26.3, 26.2, 1.21.11)'
        timeout-minutes: 20
        run: './gradlew assemble'

      - name: 'Build Forge 1.8.9'
        timeout-minutes: 20
        run: |
          cd forge-1.8
          chmod +x gradlew
          ./gradlew build -Dorg.gradle.java.home="$JAVA_HOME_8_X64"

      - name: 'Collect Artifacts'
        run: |
          mkdir -p build-artifacts
          cp -v build/libs/CookieIAS-*.jar build-artifacts/
          cp -v forge-1.8/build/libs/CookieIAS-*.jar build-artifacts/

      - name: 'Upload Artifacts'
        timeout-minutes: 5
        uses: 'actions/upload-artifact@v4'
        with:
          name: 'CookieIAS-Build-Jars'
          path: 'build-artifacts/'
          retention-days: 7
